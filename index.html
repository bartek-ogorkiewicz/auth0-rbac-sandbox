<!doctype html>
<html>
<head><meta charset="utf-8"><title>Auth0 RBAC sandbox</title></head>
<body style="font-family: sans-serif; max-width: 900px; margin: 2rem auto;">
    <button id="login">Zaloguj</button>
    <button id="logout">Wyloguj</button>
    <h3>ID token (dla frontu)</h3><pre id="id"></pre>
    <h3>Access token (dla backendu)</h3><pre id="access"></pre>

    <script src="https://cdn.auth0.com/js/auth0-spa-js/2.1/auth0-spa-js.production.js"></script>
    <script>
        const decode = ( jwt ) => JSON.parse( atob( jwt.split( '.' )[1].replace( /-/g, '+' ).replace( /_/g, '/' ) ) );

        ( async () => {
            const client = await auth0.createAuth0Client( {
                domain: 'TWOJA_DOMENA',
                clientId: 'TWOJ_CLIENT_ID',
                authorizationParams: {
                    redirect_uri: window.location.origin,
                    audience: 'https://api.rbac-sandbox',
                },
            } );

            if ( location.search.includes( 'code=' ) ) {
                await client.handleRedirectCallback();
                history.replaceState( {}, '', '/' );
            }

            document.getElementById( 'login' ).onclick = () => client.loginWithRedirect();
            document.getElementById( 'logout' ).onclick = () => client.logout( { logoutParams: { returnTo: window.location.origin } } );

            if ( await client.isAuthenticated() ) {
                const idClaims = await client.getIdTokenClaims();
                const accessToken = await client.getTokenSilently();
                document.getElementById( 'id' ).textContent = JSON.stringify( idClaims, null, 2 );
                document.getElementById( 'access' ).textContent = JSON.stringify( decode( accessToken ), null, 2 );
            }
        } )();
    </script>
</body>
</html>
